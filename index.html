<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vrtnica &amp; Mak</title>
  <style>
    @font-face {
      font-family: "Playfair Display";
      src: url("./static/PlayfairDisplay-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "Playfair Display";
      src: url("./static/PlayfairDisplay-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }

    @font-face {
      font-family: "Playfair Display";
      src: url("./static/PlayfairDisplay-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
    }

    :root {
      --color-bg-cream: #F5EFE8;
      --color-bg-white: #FFFFFF;
      --color-forest: #2D4A3B;
      --color-forest-dark: #1F3A2D;
      --color-terracotta: #B8513A;
      --color-text: #4A4A44;
      --color-text-muted: #6B6B64;
      --color-border: #3A3A34;
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      color: var(--color-text);
      background: var(--color-bg-white);
      line-height: 1.6;
    }

    img { display: block; width: 100%; height: 100%; object-fit: cover; }
    a { color: inherit; text-decoration: none; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .top { background: var(--color-bg-cream); }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0 20px;
    }

    .logo {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 30px;
      color: var(--color-forest);
      letter-spacing: -0.01em;
    }

    .logo em {
      font-style: italic;
      font-weight: 400;
      color: var(--color-terracotta);
    }

    .nav { display: flex; gap: 20px; font-size: 16px; }
    .nav a:hover { color: var(--color-terracotta); }

    .btn {
      display: inline-block;
      padding: 16px 28px;
      border-radius: 999px;
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background .2s, color .2s, transform .2s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-forest { background: var(--color-forest); color: #fff; }
    .btn-forest:hover { background: var(--color-forest-dark); }
    .btn-terracotta { background: var(--color-terracotta); color: #fff; }
    .btn-terracotta:hover { background: #9E4330; }
    .btn-outline {
      background: transparent;
      color: var(--color-border);
      border-color: var(--color-border);
    }
    .btn-outline:hover { background: var(--color-border); color: #fff; }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      align-items: center;
      padding: 42px 0 80px;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-terracotta);
      margin-bottom: 24px;
    }

    .hero h1 {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: clamp(48px, 6vw, 84px);
      line-height: 1.02;
      letter-spacing: -0.02em;
      color: var(--color-forest);
      margin-bottom: 32px;
    }
    .hero h1 em { font-style: italic; color: var(--color-terracotta); }

    .hero p {
      font-size: 20px;
      max-width: 460px;
      margin-bottom: 40px;
    }

    .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }

    .hero-image {
      height: 520px;
      border-radius: 999px 999px 26px 26px;
      overflow: hidden;
      background: linear-gradient(135deg, #ede0d2, #dcc7b0);
    }

    .occasions { padding: 72px 0 88px; }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .section-head h2 {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 48px;
      line-height: 1.1;
      color: var(--color-forest);
    }
    .section-head a {
      color: var(--color-forest);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .card {
      aspect-ratio: 4 / 5;
      border-radius: 22px;
      overflow: hidden;
      background: linear-gradient(135deg, #f1eae2, #dfd0bf);
      position: relative;
    }

    .card:nth-child(1) { background: linear-gradient(135deg, #f5dfe1, #d9c2c8); }
    .card:nth-child(2) { background: linear-gradient(135deg, #dfe6ef, #bdcce1); }
    .card:nth-child(3) { background: linear-gradient(135deg, #f0d5d5, #d8aab0); }
    .card:nth-child(4) { background: linear-gradient(135deg, #efe7d8, #d8c4a6); }

    @media (max-width: 960px) {
      .nav { display: none; }
      .hero { grid-template-columns: 1fr; padding-bottom: 64px; }
      .hero-image { height: 440px; }
      .cards { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      .section-head { flex-direction: column; align-items: flex-start; gap: 12px; }
      .section-head h2 { font-size: 36px; }
      .cards { grid-template-columns: 1fr; }
      .header .btn { padding: 12px 20px; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="container">
      <header class="header">
        <a href="#" class="logo">Vrtnica <em>&amp;</em> Mak</a>
        <nav class="nav">
          <a href="sopki.html">Šopki</a>
          <a href="poroke.html">Poroke</a>
          <a href="loncnice.html">Lončnice</a>
          <a href="onas.html">O nas</a>
          <a href="kontakt.html">Kontakt</a>
        </nav>
        <a href="#" class="btn btn-forest">Naroči šopek</a>
      </header>

      <section class="hero">
        <div>
          <div class="eyebrow">Cvetličarna v Ljubljani</div>
          <h1>Cvetje, ki pove <em>več</em> kot besede.</h1>
          <p>Ročno vezani šopki iz sezonskega cvetja, aranžmaji za poroke in praznovanja ter lončnice, ki zdržijo.</p>
          <div class="hero-actions">
            <a href="#" class="btn btn-terracotta">Izberi šopek</a>
            <a href="#" class="btn btn-outline">Poročni aranžmaji</a>
          </div>
        </div>
        <div class="hero-image">
          <img src="./jenny_sopek_iz_vrtnic_soncnic_marjetic_in_lisianthusa_1-1024x1024.jpg.webp" alt="Šopek vrtnic, sončnic, marjetic in lisianthusa">
        </div>
      </section>
    </div>
  </div>

  <section class="occasions">
    <div class="container">
      <div class="section-head">
        <h2>Za vsako priložnost</h2>
        <a href="#">Vsa ponudba →</a>
      </div>
      <div class="cards">
        <a href="#" class="card"><img src="./Unknown.jpg" alt="Galerija cvetja 1"></a>
        <a href="#" class="card"><img src="./Unknown-2.jpg" alt="Galerija cvetja 2"></a>
        <a href="#" class="card"><img src="./Unknown-3.jpg" alt="Galerija cvetja 3"></a>
        <a href="#" class="card"><img src="./Unknown-4.jpg" alt="Galerija cvetja 4"></a>
      </div>
    </div>
  </section>
</body>
</html>
